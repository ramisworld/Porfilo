<!-- Proof landing example. Public GitHub data snapshot: 2026-07-15. -->
<title>Brutalist — Porfilo world</title>
<style>
  :root{
    --paper:#f2f0e8; --ink:#0b0b0b; --red:#ff2f17; --muted:#67665e; --rule:#0b0b0b;
    --sans:"Helvetica Neue","Helvetica","Arial Nova",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  ::selection{background:var(--red);color:var(--paper);}
  .wrap{max-width:1360px;margin:0 auto;padding:0 26px;}
  a{color:inherit;}

  /* ---------- masthead ---------- */
  header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:2px solid var(--ink);}
  .mast{display:flex;justify-content:space-between;align-items:center;padding:12px 0;gap:16px;}
  .brand{font-weight:800;letter-spacing:-.03em;font-size:19px;display:flex;align-items:center;gap:7px;text-transform:uppercase;}
  .brand i{width:12px;height:12px;background:var(--ink);display:inline-block;}
  .mast nav{display:flex;gap:22px;}
  .mast nav a{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;}
  .mast nav a:hover{color:var(--red);}
  .status{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:14px;align-items:center;}
  .status b{color:var(--ink);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px;animation:bl 1.2s steps(1) infinite;vertical-align:0;}
  @keyframes bl{50%{opacity:.25;}}
  @media(max-width:820px){.mast nav,.status .hidem{display:none;}}

  /* ---------- hero ---------- */
  .hero{padding:2vh 0 0;}
  .metarow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 0;border-bottom:2px solid var(--ink);}
  .metarow span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .metarow span b{color:var(--ink);}
  h1.display{margin:0;font-weight:800;line-height:.84;letter-spacing:-.045em;text-transform:uppercase;
    font-size:clamp(3.2rem,14.5vw,13rem);padding:3vh 0 1vh;cursor:default;}
  h1.display .ch{display:inline-block;transition:transform .12s ease,-webkit-text-stroke-width .12s ease;-webkit-text-stroke:0 var(--ink);will-change:transform;}
  h1.display .sp{white-space:pre;}
  h1.display .red{color:var(--red);}
  .heroend{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;padding:20px 0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);align-items:start;}
  .heroend .manifesto{margin:0;font-size:clamp(1.15rem,2vw,1.7rem);line-height:1.28;font-weight:500;max-width:30ch;}
  .heroend .manifesto em{font-style:normal;color:var(--red);}
  .heroend .col{font-family:var(--mono);font-size:12px;text-align:right;line-height:1.9;text-transform:uppercase;letter-spacing:.04em;}
  .heroend .col b{background:var(--red);color:var(--paper);padding:1px 6px;}
  @media(max-width:820px){.metarow{grid-template-columns:1fr 1fr;} .heroend{grid-template-columns:1fr;} .heroend .col{text-align:left;}}

  /* ---------- marquee ---------- */
  .marq{background:var(--ink);color:var(--paper);overflow:hidden;white-space:nowrap;padding:14px 0;border-bottom:2px solid var(--ink);}
  .marq .track{display:inline-block;white-space:nowrap;will-change:transform;}
  .marq .track span{display:inline-block;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;font-size:clamp(22px,3.4vw,40px);padding:0 26px;}
  .marq .track .red{color:var(--red);}
  .marq .track .o{-webkit-text-stroke:1.5px var(--paper);color:transparent;}

  /* ---------- section frame ---------- */
  section.blk{padding:5vh 0;}
  .shead{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:baseline;padding-bottom:20px;border-bottom:2px solid var(--ink);}
  .shead .no{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--red);}
  .shead h2{margin:0;font-weight:800;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(1.5rem,4vw,3rem);overflow:hidden;}
  .shead h2 .w{display:inline-block;}
  .shead .meta{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .reveal .w{transform:translateY(105%);transition:transform .5s cubic-bezier(.16,1,.3,1);}
  .reveal.in .w{transform:none;}
  @media(prefers-reduced-motion:reduce){.reveal .w{transform:none;}}

  /* ---------- work index ---------- */
  .work a.row{display:grid;grid-template-columns:96px 1.5fr 1.4fr 90px 120px;gap:18px;align-items:center;
    padding:26px 10px;border-bottom:2px solid var(--ink);text-decoration:none;color:inherit;position:relative;transition:background .14s,color .14s,padding .18s;}
  .work a.row:first-of-type{border-top:0;}
  .work a.row:hover{background:var(--ink);color:var(--paper);padding-left:22px;}
  .work a.row:hover .idx{color:var(--red);} .work a.row:hover .go{color:var(--red);}
  .work a.row .idx{font-weight:800;font-size:38px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .work a.row .nm{font-weight:800;font-size:clamp(1.5rem,3vw,2.4rem);letter-spacing:-.03em;text-transform:uppercase;}
  .work a.row .nm .star{font-size:13px;color:var(--red);margin-left:10px;vertical-align:middle;font-family:var(--mono);letter-spacing:0;}
  .work a.row:hover .nm .star{color:var(--red);}
  .work a.row .bl{font-size:14.5px;line-height:1.35;max-width:40ch;}
  .work a.row .yr{font-family:var(--mono);font-size:13px;letter-spacing:.06em;}
  .work a.row .go{font-family:var(--mono);font-size:12px;text-transform:uppercase;text-align:right;letter-spacing:.08em;}
  @media(max-width:900px){.work a.row{grid-template-columns:60px 1fr auto;} .work a.row .bl,.work a.row .yr{display:none;}}

  /* ---------- stack / capabilities ---------- */
  .two{display:grid;grid-template-columns:1.15fr 1fr;gap:44px;padding-top:34px;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chips span{border:2px solid var(--ink);padding:10px 15px;font-weight:700;font-size:15px;letter-spacing:-.01em;text-transform:uppercase;transition:background .12s,color .12s;cursor:default;}
  .chips span:hover{background:var(--ink);color:var(--paper);}
  .chips span.primary{background:var(--red);color:var(--paper);border-color:var(--red);}
  .caps h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 16px;}
  .caps ul{list-style:none;margin:0;padding:0;}
  .caps li{display:flex;justify-content:space-between;align-items:baseline;padding:15px 0;border-bottom:2px solid var(--ink);font-weight:700;font-size:clamp(1.1rem,2vw,1.5rem);letter-spacing:-.02em;text-transform:uppercase;}
  .caps li:first-child{border-top:2px solid var(--ink);}
  .caps li span{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.1em;}
  @media(max-width:820px){.two{grid-template-columns:1fr;gap:34px;}}

  /* ---------- numbers band (inverted) ---------- */
  .numbers{background:var(--ink);color:var(--paper);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);}
  .numbers .inner{padding:6vh 0;}
  .numbers .shead{border-color:var(--paper);} .numbers .shead .no{color:var(--red);} .numbers .shead .meta{color:#9b9a90;}
  .numgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding-top:20px;}
  .num{padding:26px 20px 26px 0;border-right:1px solid rgba(242,240,232,.18);}
  .num:last-child{border-right:0;}
  .num b{display:block;font-weight:800;font-size:clamp(3rem,8vw,7rem);line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums;}
  .num b .red{color:var(--red);}
  .num span{display:block;margin-top:14px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#b7b6ac;max-width:22ch;}
  @media(max-width:820px){.numgrid{grid-template-columns:1fr 1fr;} .num:nth-child(2n){border-right:0;}}

  /* ---------- credentials (optional slot) ---------- */
  .creds a.crow{display:grid;grid-template-columns:1.4fr 1fr 130px;gap:18px;align-items:center;padding:22px 10px;border-bottom:2px solid var(--ink);text-decoration:none;color:inherit;transition:background .14s,color .14s,padding .18s;}
  .creds a.crow:hover{background:var(--red);color:var(--paper);padding-left:22px;}
  .creds a.crow .ti{font-weight:800;font-size:clamp(1.2rem,2.4vw,1.8rem);letter-spacing:-.02em;text-transform:uppercase;}
  .creds a.crow .is{font-family:var(--mono);font-size:13px;letter-spacing:.04em;}
  .creds a.crow .yr{font-family:var(--mono);font-size:12px;text-align:right;letter-spacing:.06em;}

  /* ---------- contact (inverted close) ---------- */
  .contact{background:var(--ink);color:var(--paper);padding:9vh 0 5vh;}
  .contact .big{font-weight:800;text-transform:uppercase;letter-spacing:-.045em;line-height:.86;font-size:clamp(3rem,13vw,12rem);margin:0 0 3vh;}
  .contact .big .red{color:var(--red);}
  .copyrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;border-top:2px solid var(--paper);border-bottom:2px solid var(--paper);padding:22px 0;}
  .copybtn{appearance:none;background:transparent;border:2px solid var(--paper);color:var(--paper);font-family:var(--mono);font-size:clamp(14px,2.4vw,24px);letter-spacing:.02em;padding:14px 22px;cursor:pointer;text-transform:none;display:flex;align-items:center;gap:16px;transition:background .12s,color .12s;}
  .copybtn:hover{background:var(--red);border-color:var(--red);color:var(--paper);}
  .copybtn .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;}
  .copybtn.done{background:var(--paper);color:var(--ink);border-color:var(--paper);}
  .clinks{display:flex;gap:26px;margin-left:auto;font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.08em;flex-wrap:wrap;}
  .clinks a{text-decoration:none;} .clinks a:hover{color:var(--red);}
  .colophon{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:5vh;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9b9a90;}
  @media(max-width:820px){.copyrow{flex-direction:column;align-items:stretch;} .clinks{margin-left:0;}}
</style>

<header><div class="wrap"><div class="mast">
  <div class="brand" id="brand"></div>
  <nav><a href="#work">Work</a><a href="#stack">Stack</a><a href="#numbers">Index</a><a href="#contact">Contact</a></nav>
  <div class="status" id="status"></div>
</div></div></header>

<div class="wrap">
  <section class="hero">
    <div class="metarow" id="metarow"></div>
    <h1 class="display" id="hh"></h1>
    <div class="heroend">
      <p class="manifesto" id="manifesto"></p>
      <div class="col" id="primary"></div>
    </div>
  </section>
</div>

<div class="marq"><div class="track" id="t1"></div></div>

<div class="wrap">
  <section class="blk work" id="work">
    <div class="shead reveal"><span class="no">01</span><h2><span class="w">Selected Work</span></h2><span class="meta" id="work-meta"></span></div>
    <div id="projs"></div>
  </section>

  <section class="blk" id="stack">
    <div class="shead reveal"><span class="no">02</span><h2><span class="w">Stack &amp; Capabilities</span></h2><span class="meta">What I build with</span></div>
    <div class="two">
      <div class="caps"><h3>// Languages &amp; Tools</h3><div class="chips" id="chips"></div></div>
      <div class="caps"><h3>// Disciplines</h3><ul id="disciplines"></ul></div>
    </div>
  </section>
</div>

<div class="marq"><div class="track" id="t2"></div></div>

<section class="numbers" id="numbers"><div class="wrap"><div class="inner">
  <div class="shead reveal"><span class="no">03</span><h2><span class="w">The Index</span></h2><span class="meta">By the numbers</span></div>
  <div class="numgrid" id="numgrid"></div>
</div></div></section>

<div class="wrap"><section class="blk creds" id="creds" hidden>
  <div class="shead reveal"><span class="no">04</span><h2><span class="w">Credentials</span></h2><span class="meta">Verified</span></div>
  <div id="credrows"></div>
</section></div>

<section class="contact" id="contact"><div class="wrap">
  <div class="big" style="padding-top:1vh">Let’s<br>build<span class="red">.</span></div>
  <div class="copyrow">
    <button class="copybtn" id="copy"><span class="tag">Copy ⧉</span><span id="copytxt"></span></button>
    <div class="clinks" id="clinks"></div>
  </div>
  <div class="colophon" id="colophon"></div>
</div></section>

<script>
/* ============================================================================
   FILL CONTRACT — the portfolio renderer replaces ONLY the DATA object below.
   The shape is identical across every world (see world-prompts/FILL_CONTRACT.md).
   Everything after "END DATA" is template logic and must not change per user.
   ============================================================================ */
const DATA = {
  "identity": {
    "name": "Rich Harris",
    "handle": "Rich-Harris",
    "role": "Software engineer and Svelte creator",
    "headline": "Rethinking how the web builds user interfaces.",
    "location": "New York City",
    "available": false
  },
  "tagline": "Compilers, web frameworks, animation and focused developer tools.",
  "email": "",
  "links": {
    "github": "https://github.com/Rich-Harris",
    "site": "https://svelte.dev"
  },
  "stats": {
    "contributionsPastYear": 2925,
    "publicRepos": 217,
    "featuredBuilds": 4,
    "buildingSince": 2011
  },
  "stack": [
    "JavaScript",
    "TypeScript",
    "Svelte",
    "CSS"
  ],
  "primaryStack": "JavaScript",
  "disciplines": [
    [
      "Frameworks",
      "Svelte"
    ],
    [
      "Compilers",
      "Web tooling"
    ],
    [
      "Interfaces",
      "Animation and interaction"
    ]
  ],
  "projects": [
    {
      "name": "svelte",
      "year": 2026,
      "tech": [
        "JavaScript",
        "Svelte"
      ],
      "stars": 87625,
      "repoUrl": "https://github.com/sveltejs/svelte",
      "demoUrl": "https://svelte.dev",
      "blurb": "A compiler-driven UI framework for concise, efficient web development."
    },
    {
      "name": "kit",
      "year": 2026,
      "tech": [
        "JavaScript",
        "Svelte"
      ],
      "stars": 20669,
      "repoUrl": "https://github.com/sveltejs/kit",
      "demoUrl": "https://svelte.dev/docs/kit",
      "blurb": "Svelte's framework for streamlined full-stack web development."
    },
    {
      "name": "degit",
      "year": 2026,
      "tech": [
        "TypeScript"
      ],
      "stars": 7896,
      "repoUrl": "https://github.com/Rich-Harris/degit",
      "blurb": "A straightforward project-scaffolding utility."
    },
    {
      "name": "magic-string",
      "year": 2025,
      "tech": [
        "JavaScript"
      ],
      "stars": 2713,
      "repoUrl": "https://github.com/Rich-Harris/magic-string",
      "blurb": "A library for precise, source-map-aware string manipulation."
    }
  ],
  "experience": [],
  "credentials": []
};
/* ===== END DATA — template logic below (world-specific, not per-user) ======= */

const R = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STAR_MIN = 50; // honest-data: show a repo's stars only when genuinely impressive

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const accent = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');   // *word* -> red
const $ = (id) => document.getElementById(id);

const id = DATA.identity;
const [city, region] = id.location.split(',').map((s) => s.trim());

// ---- masthead ----
$('brand').innerHTML = esc(id.name) + ' <i></i>';
$('status').innerHTML =
  (id.available ? `<span class="hidem"><span class="dot"></span>Available for work</span>` : '') +
  (id.timezone ? `<span>${esc(city || '')} <b id="clk">—:—:—</b> ${esc(id.tzLabel || '')}</span>` : '');

// ---- hero ----
$('metarow').innerHTML = [
  esc(id.role),
  `<b>${esc(city || id.location)}</b>${region ? ' — ' + esc(region) : ''}`,
  `@${esc(id.handle)} · <b>${DATA.stats.publicRepos}</b> repos`,
  '№ 001 / Portfolio',
].map((h) => `<span>${h}</span>`).join('');

// giant headline -> per-character spans (for cursor-pressure), red period at the end
const hl = String(id.headline).replace(/\s*\.?\s*$/, '');
$('hh').innerHTML = [...hl].map((c) => c === ' ' ? '<span class="ch sp"> </span>' : `<span class="ch">${esc(c)}</span>`).join('') + '<span class="ch red">.</span>';

$('manifesto').innerHTML = accent(DATA.tagline);

const rest = DATA.stack.filter((s) => s !== DATA.primaryStack);
$('primary').innerHTML = `Primary stack<br><b>${esc(DATA.primaryStack)}</b>` +
  (rest.length ? `<br>${rest.slice(0, 2).map(esc).join(' · ')}` : '') +
  (rest.length > 2 ? `<br>${rest.slice(2, 4).map(esc).join(' · ')}` : '');

// ---- work ----
const yrs = DATA.projects.map((p) => p.year).filter(Boolean);
$('work-meta').textContent = `${Math.min(...yrs)} — ${Math.max(...yrs)} · ${String(DATA.projects.length).padStart(2, '0')} builds`;
$('projs').innerHTML = DATA.projects.map((p, i) => {
  const star = (p.stars && p.stars >= STAR_MIN) ? `<span class="star">★ ${p.stars}</span>` : '';
  const tech = (p.tech || []).join(' / ');
  return `<a class="row" href="${esc(p.repoUrl)}" target="_blank" rel="noreferrer">` +
    `<span class="idx">${String(i + 1).padStart(2, '0')}</span>` +
    `<span class="nm">${esc(p.name)}${star}</span>` +
    `<span class="bl">${esc(p.blurb)}</span>` +
    `<span class="yr">${esc(p.year)}</span>` +
    `<span class="go">${esc(tech)} ↗</span></a>`;
}).join('');

// ---- stack chips + disciplines ----
$('chips').innerHTML = DATA.stack.map((s) => `<span class="${s === DATA.primaryStack ? 'primary' : ''}">${esc(s)}</span>`).join('');
$('disciplines').innerHTML = DATA.disciplines.map(([k, v]) => `<li>${esc(k)} <span>${esc(v)}</span></li>`).join('');

// ---- numbers ----
const st = DATA.stats, since = st.buildingSince;
$('numgrid').innerHTML = [
  { n: st.contributionsPastYear, label: 'Contributions in the last year' },
  { n: st.publicRepos, label: 'Public repositories shipped' },
  { n: st.featuredBuilds, label: 'Featured builds in this index' },
  { since: true, label: `Building &amp; shipping since ${since}` },
].map((x) => x.since
  ? `<div class="num"><b>’${String(since).slice(2)}<span class="red">→</span></b><span>${x.label}</span></div>`
  : `<div class="num"><b data-n="${x.n}">0</b><span>${x.label}</span></div>`
).join('');

// ---- credentials (optional) ----
if (Array.isArray(DATA.credentials) && DATA.credentials.length) {
  $('creds').hidden = false;
  $('credrows').innerHTML = DATA.credentials.map((c) =>
    `<a class="crow" href="${esc(c.url || '#')}"${c.url ? ' target="_blank" rel="noreferrer"' : ''}>` +
    `<span class="ti">${esc(c.title)}</span><span class="is">${esc(c.issuer)}</span><span class="yr">${esc(c.year)}</span></a>`
  ).join('');
}

// ---- contact ----
$('copytxt').textContent = DATA.email;
const L = DATA.links || {};
$('clinks').innerHTML = [
  L.github && `<a href="${esc(L.github)}" target="_blank" rel="noreferrer">GitHub ↗</a>`,
  L.site && `<a href="${esc(L.site)}" target="_blank" rel="noreferrer">${esc(L.site.replace(/^https?:\/\//, ''))} ↗</a>`,
  L.linkedin && `<a href="${esc(L.linkedin)}" target="_blank" rel="noreferrer">LinkedIn ↗</a>`,
  L.x && `<a href="${esc(L.x)}" target="_blank" rel="noreferrer">X ↗</a>`,
].filter(Boolean).join('');
$('colophon').innerHTML = [
  `© ${esc(id.name)} — ${esc(city || id.location)}`,
  `Set in Helvetica · ${esc(city || '')} ◼`,
  id.available ? 'Open to work' : '',
].filter(Boolean).map((s) => `<span>${s}</span>`).join('');

// ---- marquees (stack words, scroll-velocity reactive) ----
function fillTrack(el, accentEvery, outlineEvery) {
  const one = DATA.stack.map((w, i) => {
    const cls = accentEvery && i % accentEvery === 0 ? 'red' : (outlineEvery && i % outlineEvery === 0 ? 'o' : '');
    return `<span class="${cls}">${esc(w)} ◼</span>`;
  }).join('');
  el.innerHTML = one + one + one;
}
fillTrack($('t1'), 3, 0);
fillTrack($('t2'), 0, 4);

let lastY = window.scrollY, sVel = 0;
addEventListener('scroll', () => { const y = window.scrollY; sVel = y - lastY; lastY = y; }, { passive: true });
(function () {
  const t1 = $('t1'), t2 = $('t2');
  let x1 = 0, x2 = -(t2.scrollWidth / 3 || 1);
  const w1 = t1.scrollWidth / 3 || 1, w2 = t2.scrollWidth / 3 || 1;
  function f() {
    requestAnimationFrame(f); if (document.hidden) return;
    const boost = R ? 0 : Math.min(6, Math.abs(sVel) * 0.14);
    const base = 0.6;
    x1 -= (base + boost); x2 += (base + boost);
    if (-x1 >= w1) x1 += w1; if (x1 > 0) x1 -= w1;
    if (x2 >= 0) x2 -= w2; if (-x2 >= w2) x2 += w2;
    const sk = R ? 0 : Math.max(-8, Math.min(8, sVel * 0.35));
    t1.style.transform = `translateX(${x1}px) skewX(${-sk}deg)`;
    t2.style.transform = `translateX(${x2}px) skewX(${sk}deg)`;
    sVel *= 0.86;
  }
  f();
})();

// ---- cursor-pressure headline (TextPressure / VariableProximity) ----
(function () {
  if (R) return;
  const chars = [...$('hh').querySelectorAll('.ch')];
  let mx = -9999, my = -9999, raf = 0;
  function upd() {
    raf = 0;
    chars.forEach((c) => {
      const r = c.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const f = Math.max(0, 1 - Math.hypot(mx - cx, my - cy) / 260);
      c.style.transform = `translateY(${(-10 * f).toFixed(1)}px) scale(${(1 + 0.09 * f).toFixed(3)})`;
      c.style.webkitTextStrokeWidth = (1.6 * f).toFixed(2) + 'px';
    });
  }
  addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; if (!raf) raf = requestAnimationFrame(upd); }, { passive: true });
  addEventListener('pointerleave', () => { mx = my = -9999; if (!raf) raf = requestAnimationFrame(upd); });
})();

// ---- reveals (fast mechanical clip-wipe on headings) ----
(function () {
  const els = [...document.querySelectorAll('.reveal')];
  const show = (e) => e.classList.add('in');
  if (typeof IntersectionObserver !== 'function') { els.forEach(show); return; }
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } }), { threshold: .4 });
  els.forEach((e) => io.observe(e));
  setTimeout(() => els.forEach(show), 2200); // settle fallback (screenshots / nested iframes)
})();

// ---- count-up numbers on view ----
function countUp(el, to) {
  const dur = 1200; let s = null;
  function step(ts) { if (s === null) s = ts; const p = Math.min(1, (ts - s) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
(function () {
  const nums = [...document.querySelectorAll('.num b[data-n]')];
  let fired = false;
  const fire = () => { if (fired) return; fired = true; nums.forEach((n) => R ? (n.textContent = n.dataset.n) : countUp(n, +n.dataset.n)); };
  if (typeof IntersectionObserver !== 'function') { fire(); return; }
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { fire(); io.disconnect(); } }), { threshold: .3 });
  io.observe($('numbers'));
  setTimeout(fire, 2400);
})();

// ---- live clock (identity.timezone) ----
(function () {
  const el = $('clk'); if (!el || !id.timezone) return;
  function t() { try { el.textContent = new Date().toLocaleTimeString('en-GB', { hour12: false, timeZone: id.timezone }); } catch (e) { el.textContent = ''; } }
  t(); setInterval(t, 1000);
})();

// ---- copy email ----
(function () {
  const b = $('copy'), txt = $('copytxt');
  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(DATA.email); } catch (e) {}
    b.classList.add('done'); txt.textContent = 'COPIED ✓';
    setTimeout(() => { b.classList.remove('done'); txt.textContent = DATA.email; }, 1400);
  });
})();
