er;font:8px var(--mono);text-transform:uppercase}.lm-controls input{accent-color:#d43f27}.v-loom .cursor{width:72px;height:20px;background:#8b5a31;clip-path:polygon(0 50%,18% 0,82% 0,100% 50%,82% 100%,18% 100%);transform:translate(-50%,-50%)}.v-loom .cursor::after{content:"";position:absolute;left:68px;top:9px;width:75px;height:2px;background:#d43f27}

$('brand').innerHTML=`${esc(id.name)} <em>/${esc(id.handle)}</em>`;$('mode').textContent=labels[v];$('live').innerHTML=`${id.available?'<i></i><span>Available</span>':''}<b id="clock">--:--:--</b>`;$('stackline').innerHTML=(DATA.stack||[]).map(s=>`<span>${esc(s)}</span>`).join('');const L=DATA.links||{};$('socials').innerHTML=[L.github&&`<a href="${esc(L.github)}" target="_blank" rel="noreferrer">GitHub ↗</a>`,L.site&&`<a href="${esc(L.site)}" target="_blank" rel="noreferrer">Site ↗</a>`].filter(Boolean).join('');
function tick(){try{$('clock').textContent=new Intl.DateTimeFormat('en-NZ',{timeZone:id.timezone||undefined,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())+(id.tzLabel?' '+id.tzLabel:'')}catch{$('clock').textContent='LIVE'}}tick();setInterval(tick,1000);$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(DATA.email)}catch{const t=document.createElement('textarea');t.value=DATA.email;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}$('toast').textContent=`Signal copied · ${DATA.email}`;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)});
let selected=0;function detailHTML(p,i){return `<div class="ty-k">Object 0${i+1} / ${esc(p.year)} / ${tech(p)}</div><h2>${pname(p.name)}${star(p)}</h2><p>${esc(p.blurb)}</p><a class="target" href="${esc(p.repoUrl)}" target="_blank" rel="noreferrer">Open repository ↗</a>`}
if(v==='type'){const n=$('ty-name'),w=$('ty-width'),s=$('ty-slant');w.oninput=()=>{n.style.setProperty('--width',w.value/100);$('ty-wv').textContent=w.value};s.oninput=()=>{n.style.setProperty('--slant',s.value+'deg');$('ty-sv').textContent=s.value+'°'}}
if(v==='city'){let pan={x:0,y:0,z:1},drag=null,st=$('ct-stage'),map=$('ct-map');const place=()=>map.style.transform=`translate(calc(-50% + ${pan.x}px),calc(-50% + ${pan.y}px)) rotateX(58deg) rotateZ(-38deg) scale(${pan.z})`;st.onpointerdown=e=>{if(e.target.closest('a'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};st.setPointerCapture(e.pointerId)};st.onpointermove=e=>{if(drag&&e.pointerId===drag.id){pan.x=drag.px+e.clientX-drag.x;pan.y=drag.py+e.clientY-drag.y;place()}};st.onpointerup=()=>drag=null;st.onwheel=e=>{e.preventDefault();pan.z=Math.max(.55,Math.min(1.45,pan.z+(e.deltaY<0?.07:-.07)));place()}}
function synthDetail(i){selected=+i;$('sy-detail').innerHTML=detailHTML(P[selected],selected);document.querySelectorAll('.module').forEach((n,k)=>n.classList.toggle('active',k===selected))}if(v==='synth'){synthDetail(0);document.querySelectorAll('.module').forEach(n=>{n.onpointerenter=()=>synthDetail(n.dataset.i);n.onfocus=()=>synthDetail(n.dataset.i)});document.querySelectorAll('[data-patch]').forEach(b=>b.onclick=()=>b.classList.toggle('on'))}
if(v==='pinball'){let bx=50,by=15,vx=.17,vy=.08;const ball=$('pb-ball'),board=$('pb-board'),fl=$('fl'),fr=$('fr');const flip=(n,on)=>n.classList.toggle('on',on);$('left').onpointerdown=()=>flip(fl,1);$('left').onpointerup=()=>flip(fl,0);$('right').onpointerdown=()=>flip(fr,1);$('right').onpointerup=()=>flip(fr,0);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')flip(fl,1);if(e.key==='ArrowRight')flip(fr,1);if(e.key===' '){by=8;vy=.12}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')flip(fl,0);if(e.key==='ArrowRight')flip(fr,0)});window.pbStep=()=>{bx+=vx;by+=vy;vy+=.002;if(bx<3||bx>94)vx*=-1;if(by<3){by=3;vy=Math.abs(vy)}if(by>88){by=12;vy=-.02}ball.style.left=bx+'%';ball.style.top=by+'%'}}
if(v==='loom'){const r=$('lm-tension'),frame=$('lm-frame'),sh=$('shuttle');r.oninput=()=>{frame.style.backgroundSize=r.value+'px 100%';$('lm-v').textContent=r.value};frame.onpointermove=e=>{const b=frame.getBoundingClientRect();sh.style.left=((e.clientX-b.left)/b.width*100)+'%';sh.style.top=((e.clientY-b.top)/b.height*100)+'%'}}
function climateDetail(i){selected=+i;$('cl-info').innerHTML=detailHTML(P[selected],selected);document.querySelectorAll('.cl-row,.station').forEach(n=>n.classList.toggle('active',+n.dataset.i===selected))}if(v==='climate'){climateDetail(0);document.querySelectorAll('.cl-row,.station').forEach(n=>{n.onpointerenter=()=>climateDetail(n.dataset.i);n.onfocus=()=>climateDetail(n.dataset.i)});let d=null,pr=$('pressure'),map=$('cl-map');pr.style.left='58%';pr.style.top='52%';pr.onpointerdown=e=>{d=e.pointerId;pr.setPointerCapture(d)};pr.onpointermove=e=>{if(d===e.pointerId){const b=map.getBoundingClientRect();pr.style.left=(e.clientX-b.left)+'px';pr.style.top=(e.clientY-b.top)+'px'}};pr.onpointerup=()=>d=null}

function darkDetail(i){selected=+i;const p=P[selected];$('photo').innerHTML=`<div class="no">Print 0${selected+1} / ${esc(p.year)}</div><h2>${pname(p.name)}${star(p)}</h2><p>${esc(p.blurb)}</p><a href="${esc(p.repoUrl)}" target="_blank" rel="noreferrer">${tech(p)} / Open repository ↗</a>`;document.querySelectorAll('.negative').forEach((n,k)=>n.classList.toggle('active',k===selected))}if(v==='darkroom'){darkDetail(0);document.querySelectorAll('.negative').forEach(n=>{n.onpointerenter=()=>darkDetail(n.dataset.i);n.onfocus=()=>darkDetail(n.dataset.i)});$('exposure').oninput=e=>{$('photo').style.setProperty('--exposure',e.target.value/100);$('expv').textContent=e.target.value}}

function seismicDetail(i){selected=+i;$('sv-info').innerHTML=detailHTML(P[selected],selected);document.querySelectorAll('.layer').forEach((n,k)=>n.classList.toggle('active',k===selected));$('depthv').textContent=String(selected*240).padStart(3,'0')+'m'}if(v==='seismic'){seismicDetail(0);$('depth').oninput=e=>seismicDetail(e.target.value);document.querySelectorAll('.layer').forEach(n=>{n.onpointerenter=()=>{$('depth').value=n.dataset.i;seismicDetail(n.dataset.i)};n.onfocus=()=>seismicDetail(n.dataset.i)})}
const cur=$('cursor');let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,lastX=mx,lastY=my,bearing=0,cursorRaf=0,rake=[];addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;bearing=Math.atan2(my-lastY,mx-lastX)*180/Math.PI;lastX=mx;lastY=my});function cursorFrame(){cursorRaf=0;cx+=(mx-cx)*.22;cy+=(my-cy)*.22;cur.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;cur.style.setProperty('--bearing',bearing+'deg');if(!document.hidden)cursorRaf=requestAnimationFrame(cursorFrame)}function cursorMotion(){if(R){cur.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;return}if(document.hidden){if(cursorRaf)cancelAnimationFrame(cursorRaf);cursorRaf=0}else if(!cursorRaf)cursorRaf=requestAnimationFrame(cursorFrame)}document.addEventListener('visibilitychange',cursorMotion);cursorMotion();
const c=$('fx'),x=c.getContext('2d');let w=0,h=0,dpr=1,raf=0;const seed=n=>{const z=Math.sin(n*127.1)*43758.5453;return z-Math.floor(z)};function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);draw(0)}addEventListener('resize',resize);
function draw(t){x.clearRect(0,0,w,h);const T=R?0:t*.001;if(v==='type'){x.strokeStyle='rgba(17,17,17,.14)';for(let yy=70;yy<h;yy+=38){x.beginPath();x.moveTo(0,yy+Math.sin(T+yy)*2);x.lineTo(w,yy);x.stroke()}}
else if(v==='city'){x.fillStyle='rgba(57,124,255,.18)';for(let i=0;i<80;i++){const px=seed(i)*w,py=(seed(i+90)*h+T*(3+seed(i)*8))%h;x.fillRect(px,py,1.5,1.5)}}
else if(v==='synth'){x.strokeStyle='rgba(255,122,46,.18)';x.beginPath();for(let xx=0;xx<w;xx+=6)x.lineTo(xx,h*.66+Math.sin(xx*.018+T*2)*22+Math.sin(xx*.05-T)*7);x.stroke()}
else if(v==='pinball'){x.strokeStyle='rgba(255,207,114,.12)';for(let i=0;i<15;i++){x.beginPath();x.arc(w*.7,h*.46,50+i*38,0,6.283);x.stroke()}if(window.pbStep)window.pbStep()}
else if(v==='loom'){for(let yy=0;yy<h;yy+=18){x.strokeStyle=yy%36?'rgba(21,41,75,.08)':'rgba(212,63,39,.1)';x.beginPath();x.moveTo(0,yy+Math.sin(T+yy)*3);x.lineTo(w,yy+Math.sin(T+yy)*3);x.stroke()}}
else if(v==='climate'){x.strokeStyle='rgba(20,52,74,.16)';for(let i=0;i<22;i++){x.beginPath();for(let xx=0;xx<w;xx+=12)x.lineTo(xx,(i+1)*h/23+Math.sin(xx*.012+T+i)*8);x.stroke()}}
else if(v==='zen'){x.strokeStyle='rgba(65,57,44,.22)';x.lineWidth=1.2;if(rake.length>1)for(let q=0;q<7;q++){x.beginPath();rake.forEach((p,i)=>i?x.lineTo(p[0]+q*7-21,p[1]):x.moveTo(p[0]+q*7-21,p[1]));x.stroke()}}
else if(v==='darkroom'){x.fillStyle='rgba(227,57,50,.04)';for(let i=0;i<90;i++)x.fillRect(seed(i)*w,seed(i+80)*h,seed(i+160)*3,seed(i+160)*3)}
else if(v==='sculpture'){x.strokeStyle='rgba(39,93,255,.13)';for(let i=0;i<20;i++){x.beginPath();x.arc(w*.7+Math.sin(T*.3+i)*50,h*.5,50+i*22,0,6.283);x.stroke()}}
else if(v==='seismic'){x.strokeStyle='#2de0d0';x.lineWidth=1.2;x.beginPath();for(let xx=0;xx<w;xx+=3){const amp=Math.exp(-Math.pow((xx%330)-165,2)/950)*42;x.lineTo(xx,h*.63+Math.sin(xx*.17-T*5)*amp)}x.stroke()}}
function frame(t){raf=0;draw(t);if(!document.hidden)raf=requestAnimationFrame(frame)}function motion(){if(R){draw(0);return}if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0}else if(!raf)raf=requestAnimationFrame(frame)}document.addEventListener('visibilitychange',motion);resize();motion();
