let selected=0,bearing=-38,targetBearing=-38,dragging=false,lastAuto=performance.now(),pings=[];

  if(!projects.length)return;

  const project=projects[selected],hasStars=Number(project.stars)>=STAR_MIN;
  document.querySelectorAll("[data-project]").forEach(function(node){const active=Number(node.dataset.project)===selected;node.classList.toggle("active",active);node.setAttribute("aria-pressed",String(active))});
  if(detected){const mark=document.querySelector('.signal-mark[data-project="'+selected+'"]');if(mark){mark.classList.remove("detected");void mark.offsetWidth;mark.classList.add("detected")}}
  byId("dossier-code").textContent="SIG-"+String(selected+1).padStart(3,"0")+" / RECOVERED SOURCE";
  byId("dossier-year").textContent=project.year||"Undated";
  byId("dossier-title").textContent=project.name;
  byId("dossier-title").classList.toggle("long",String(project.name||"").length>18);
  byId("dossier-blurb").textContent=project.blurb||"Public project detected in the selected archive.";
  byId("dossier-tags").innerHTML=(project.tech||[]).slice(0,5).map(function(item){return"<span>"+esc(item)+"</span>"}).join("");
  byId("dossier-telemetry").innerHTML='<div class="dossier-cell"><small>Signal index</small><b>'+String(selected+1).padStart(2,"0")+" / "+String(projects.length).padStart(2,"0")+'</b></div><div class="dossier-cell"><small>Surface year</small><b>'+esc(project.year||"—")+'</b></div><div class="dossier-cell"><small>Primary medium</small><b>'+esc((project.tech||[])[0]||"Open")+'</b></div><div class="dossier-cell"><small>'+(hasStars?"Star signal":"Visibility")+"</small><b>"+(hasStars?"★ "+esc(project.stars):"Public source")+"</b></div>";
  const url=safeUrl(project.repoUrl);byId("dossier-open").hidden=!url;if(url)byId("dossier-open").href=url;
  byId("active-readout").textContent=String(selected+1).padStart(2,"0");
  byId("sonar-state").textContent=(project.tech||[]).slice(0,2).join(" + ")+" / "+(project.year||"active");
}

const sonar=byId("sonar");
function pointBearing(event){
  const rect=sonar.getBoundingClientRect(),x=event.clientX-(rect.left+rect.width/2),y=event.clientY-(rect.top+rect.height/2);

}
function applyBearing(){const display=(Math.round(((bearing%360)+360)%360))%360;document.documentElement.style.setProperty("--bearing",bearing+"deg");byId("bearing-readout").textContent=String(display).padStart(3,"0")+"°"}
sonar.addEventListener("pointerdown",function(event){if(event.target.closest("button"))return;dragging=true;sonar.setPointerCapture(event.pointerId);pointBearing(event)});
sonar.addEventListener("pointermove",function(event){if(dragging)pointBearing(event)});
sonar.addEventListener("pointerup",function(event){if(!dragging)return;dragging=false;if(sonar.hasPointerCapture(event.pointerId))sonar.releasePointerCapture(event.pointerId);emitPing(event.clientX,event.clientY)});
sonar.addEventListener("wheel",function(event){const impulse=Math.max(-7,Math.min(7,(event.deltaY+event.deltaX)*.028));bearing+=impulse;targetBearing=bearing;lastAuto=performance.now();applyBearing()},{passive:true});
sonar.addEventListener("keydown",function(event){if(event.key==="ArrowRight"||event.key==="ArrowDown"){event.preventDefault();selectProject(selected+1,true)}if(event.key==="ArrowLeft"||event.key==="ArrowUp"){event.preventDefault();selectProject(selected-1,true)}if(event.key==="Enter"||event.key===" "){event.preventDefault();emitPing()}});
function emitPing(clientX,clientY){
  const rect=sonar.getBoundingClientRect(),x=clientX==null?rect.width/2:clientX-rect.left,y=clientY==null?rect.height/2:clientY-rect.top;
  pings.push({x:x,y:y,r:0,a:1});
  let nearest=selected,dist=Infinity;
  positions.slice(0,projects.length).forEach(function(point,index){const dx=x-rect.width*point[0]/100,dy=y-rect.height*point[1]/100,d=Math.hypot(dx,dy);if(d<dist){dist=d;nearest=index}});
  if(dist<120)selectProject(nearest,true);else selectProject(selected,true);
  const cursor=byId("sonar-cursor");cursor.classList.remove("ping");void cursor.offsetWidth;cursor.classList.add("ping");
}
byId("emit-ping").addEventListener("click",function(){emitPing()});
applyBearing();

const canvas=byId("sonar-canvas"),ctx=canvas.getContext("2d"),particles=Array.from({length:135},function(_,index){return{x:(index*73%101)/100,y:(index*37%97)/100,s:.3+(index%7)/10,p:index*.41}}),pointerField={x:.5,y:.5,active:0};

function draw(time){
  ctx.clearRect(0,0,width,height);const cx=width/2,cy=height/2,rad=Math.min(width,height)*.43;

  const angle=bearing*Math.PI/180,beam=ctx.createConicGradient(angle,cx,cy);beam.addColorStop(0,"rgba(223,255,69,.26)");beam.addColorStop(.045,"rgba(223,255,69,0)");beam.addColorStop(1,"rgba(223,255,69,0)");ctx.fillStyle=beam;ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fill();

}
function frame(time){if(!running)return;if(sonarVisible){if(!dragging){if(time-lastAuto>1500)targetBearing+=.18;bearing+=(targetBearing-bearing)*.075}applyBearing();draw(time)}raf=requestAnimationFrame(frame)}
resize();addEventListener("resize",resize);if(REDUCE)draw(0);else raf=requestAnimationFrame(frame);
if(typeof IntersectionObserver==="function"){new IntersectionObserver(function(entries){sonarVisible=entries[0].isIntersecting},{threshold:.01}).observe(sonar)}
document.addEventListener("visibilitychange",function(){running=!document.hidden&&!REDUCE;if(running)raf=requestAnimationFrame(frame);else cancelAnimationFrame(raf)});
sonar.addEventListener("pointermove",function(event){const rect=sonar.getBoundingClientRect();pointerField.x=(event.clientX-rect.left)/rect.width;pointerField.y=(event.clientY-rect.top)/rect.height;pointerField.active=1},{passive:true});
sonar.addEventListener("pointerleave",function(){pointerField.active=Math.min(pointerField.active,.45)});
