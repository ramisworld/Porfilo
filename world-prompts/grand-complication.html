if(v==='biolume'){bioDetail(0);$('spores').innerHTML=Array.from({length:8},()=>'<i class="spore"></i>').join('');document.querySelectorAll('.bio-row,.organism').forEach(n=>{n.addEventListener('pointerenter',()=>bioDetail(n.dataset.i));n.addEventListener('focus',()=>bioDetail(n.dataset.i))})}
function gcDetail(i){selected=+i;const p=P[selected];$('gc-detail').innerHTML=`<div class="no">Complication 0${selected+1} · ${esc(p.year)} · ${tech(p)}</div><p><b>${pname(p.name)}</b> — ${esc(p.blurb)}</p>`;document.querySelectorAll('.gc-comp').forEach((n,k)=>n.classList.toggle('active',k===selected))}
if(v==='timepiece'){gcDetail(0);document.querySelectorAll('.gc-comp').forEach(n=>{n.addEventListener('pointerenter',()=>gcDetail(n.dataset.i));n.addEventListener('focus',()=>gcDetail(n.dataset.i))});let drag=null,wind=0;const crown=$('gc-crown');crown.addEventListener('pointerdown',e=>{drag={id:e.pointerId,y:e.clientY,w:wind};crown.setPointerCapture(e.pointerId)});crown.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){wind=drag.w+(drag.y-e.clientY)*.7;$('gc-dial').style.setProperty('--wind',wind)}});crown.addEventListener('pointerup',()=>drag=null)}
if(v==='blueprint'){let pan={x:0,y:0,z:1},drag=null;const stage=$('bp-stage'),sheet=$('bp-sheet');function place(){sheet.style.transform=`translate(calc(-50% + ${pan.x}px),calc(-50% + ${pan.y}px)) scale(${pan.z})`}stage.addEventListener('pointerdown',e=>{if(e.target.closest('a,input'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){pan.x=drag.px+e.clientX-drag.x;pan.y=drag.py+e.clientY-drag.y;place()}});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('wheel',e=>{e.preventDefault();pan.z=Math.max(.62,Math.min(1.5,pan.z+(e.deltaY<0?.08:-.08)));place()},{passive:false});$('bp-cut').addEventListener('input',e=>sheet.style.setProperty('--cut',e.target.value+'%'))}

const cur=$('cursor');let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,trail=[];addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(v==='blueprint')$('cursor-label').textContent=`X ${String(mx|0).padStart(4,'0')} · Y ${String(my|0).padStart(4,'0')}`;if(v==='shadowbox'&&$('sh-stage')){const r=$('sh-stage').getBoundingClientRect();$('sh-stage').style.setProperty('--sx',e.clientX-r.left+'px');$('sh-stage').style.setProperty('--sy',e.clientY-r.top+'px')}if(v==='biolume'&&$('bio-habitat')){const r=$('bio-habitat').getBoundingClientRect();$('bio-habitat').style.setProperty('--lx',e.clientX-r.left+'px');$('bio-habitat').style.setProperty('--ly',e.clientY-r.top+'px');trail.unshift([mx,my]);trail=trail.slice(0,8)}},{passive:true});
let cursorRaf=0;function cursorFrame(t){cursorRaf=0;cx+=(mx-cx)*(v==='shadowbox'?.13:.24);cy+=(my-cy)*(v==='shadowbox'?.13:.24);cur.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;cur.style.setProperty('--seconds',((t*.06)%360)+'deg');if(v==='biolume')document.querySelectorAll('.spore').forEach((s,i)=>{const q=trail[Math.min(i,trail.length-1)]||[mx,my];s.style.transform=`translate(${q[0]-2}px,${q[1]-2}px)`;s.style.opacity=String(1-i/9)});if(!document.hidden)cursorRaf=requestAnimationFrame(cursorFrame)}function cursorMotion(){if(R){cur.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;return}if(document.hidden){if(cursorRaf)cancelAnimationFrame(cursorRaf);cursorRaf=0}else if(!cursorRaf)cursorRaf=requestAnimationFrame(cursorFrame)}document.addEventListener('visibilitychange',cursorMotion);cursorMotion();

const c=$('fx'),x=c.getContext('2d');let w=0,h=0,dpr=1,raf=0;function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);draw(0)}addEventListener('resize',resize);
const seed=n=>{const z=Math.sin(n*127.1)*43758.5453;return z-Math.floor(z)};
function draw(t){x.clearRect(0,0,w,h);const T=R?0:t*.001;if(v==='blueprint'){x.strokeStyle='rgba(13,47,85,.2)';x.lineWidth=.6;for(let xx=-30+(mx*.025)%30;xx<w;xx+=30){x.beginPath();x.moveTo(xx,0);x.lineTo(xx,h);x.stroke()}for(let yy=-30+(my*.025)%30;yy<h;yy+=30){x.beginPath();x.moveTo(0,yy);x.lineTo(w,yy);x.stroke()}x.strokeStyle='rgba(255,74,44,.22)';for(let i=0;i<7;i++){x.beginPath();x.arc(w*.7,h*.48,80+i*46,0,Math.PI*2);x.stroke()}}
else if(v==='signal'){x.fillStyle='rgba(255,255,255,.035)';for(let i=0;i<220;i++){const xx=seed(i+Math.floor(T*10))*w,yy=seed(i+500+Math.floor(T*7))*h;x.fillRect(xx,yy,seed(i+900)*3,1)}x.strokeStyle='rgba(255,59,37,.34)';x.lineWidth=2;x.beginPath();for(let xx=0;xx<w;xx+=7){const yy=h*.68+Math.sin(xx*.016+T*2)*24+Math.sin(xx*.047-T)*10;x.lineTo(xx,yy)}x.stroke()}
else if(v==='shadowbox'){for(let i=0;i<14;i++){x.fillStyle=`rgba(${92+i*5},22,48,${.04+i*.003})`;x.beginPath();x.moveTo(0,h*(.22+i*.035));x.bezierCurveTo(w*.28,h*(.08+i*.04),w*.72,h*(.56-i*.018),w,h*(.2+i*.04));x.lineTo(w,h);x.lineTo(0,h);x.fill()}}
else if(v==='biolume'){for(let i=0;i<46;i++){const px=seed(i)*w,py=(seed(i+80)*h+T*(8+seed(i)*16))%(h+80)-40,r=3+seed(i+160)*15;x.strokeStyle=`rgba(116,255,210,${.06+seed(i)*.2})`;x.beginPath();x.arc(px+Math.sin(T+seed(i)*7)*9,py,r,0,Math.PI*2);x.stroke();for(let q=0;q<3;q++){x.beginPath();x.moveTo(px,py+r);x.quadraticCurveTo(px+Math.sin(T*1.3+i+q)*20,py+r+22,px+Math.sin(T+i+q)*25,py+r+46+q*10);x.stroke()}}}
else if(v==='timepiece'){x.save();x.translate(w*.73,h*.48);x.strokeStyle='rgba(185,153,93,.13)';for(let r=90;r<Math.max(w,h)*.65;r+=42){x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.stroke()}for(let i=0;i<120;i++){const a=i*Math.PI*2/120+T*.02,r=Math.min(w,h)*.46;x.beginPath();x.moveTo(Math.cos(a)*(r-9),Math.sin(a)*(r-9));x.lineTo(Math.cos(a)*r,Math.sin(a)*r);x.stroke()}x.restore()}}
const baseDraw=draw;draw=function(t){baseDraw(t);if(R)return;const T=t*.001;if(v==='blueprint'){const q=(T*34)%(w+240)-120;x.save();x.strokeStyle='rgba(255,74,44,.18)';x.setLineDash([3,9]);x.beginPath();x.moveTo(q,0);x.lineTo(q+180,h);x.stroke();x.restore()}else if(v==='shadowbox'){x.save();for(let i=0;i<18;i++){const px=seed(i)*w+Math.sin(T*.35+i)*34,py=(seed(i+90)*h+T*(4+seed(i)*7))%(h+40)-20;x.fillStyle=`rgba(255,202,114,${.025+seed(i)*.07})`;x.beginPath();x.arc(px,py,1+seed(i+50)*2,0,Math.PI*2);x.fill()}x.restore()}};function frame(t){raf=0;draw(t);if(!document.hidden)raf=requestAnimationFrame(frame)}function motion(){if(R){draw(0);return}if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0}else if(!raf)raf=requestAnimationFrame(frame)}document.addEventListener('visibilitychange',motion);resize();motion();
</script>
