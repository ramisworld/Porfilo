if(v==='bauhaus'){bindDetails('.station','bf-read');const stations=[...document.querySelectorAll('.station')];$('runline').onclick=()=>{if(assemblyTimer){clearInterval(assemblyTimer);assemblyTimer=0;$('runline').textContent='Run assembly line';return}$('runline').textContent='Stop assembly line';let i=0;assemblyTimer=setInterval(()=>{stations.forEach((n,k)=>n.classList.toggle('active',k===i));setDetail('bf-read',i);i=(i+1)%stations.length},700)}}
if(v==='polar'){bindDetails('.station-p','pe-read');const map=$('ice-map'),th=$('thermal'),r=$('scan-depth');map.onpointermove=e=>{const b=map.getBoundingClientRect();th.style.left=e.clientX-b.left+'px';th.style.top=e.clientY-b.top+'px'};r.oninput=()=>{$('scan-v').textContent=String(r.value).padStart(2,'0')+' m';th.style.width=th.style.height=(120+r.value*15)+'px'}}

const cur=$('cursor');let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,lastX=mx,lastY=my,bearing=0,cursorRaf=0;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;bearing=Math.atan2(my-lastY,mx-lastX);lastX=mx;lastY=my});function cursorFrame(){cursorRaf=0;cx+=(mx-cx)*.24;cy+=(my-cy)*.24;cur.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;cur.style.setProperty('--cut',bearing+'rad');cur.style.setProperty('--turn',bearing+'rad');if(!document.hidden)cursorRaf=requestAnimationFrame(cursorFrame)}function cursorMotion(){if(R){cur.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;return}if(document.hidden){if(cursorRaf)cancelAnimationFrame(cursorRaf);cursorRaf=0}else if(!cursorRaf)cursorRaf=requestAnimationFrame(cursorFrame)}document.addEventListener('visibilitychange',cursorMotion);cursorMotion();
const c=$('atmo'),x=c.getContext('2d');let w=0,h=0,dpr=1,raf=0;const seed=n=>{const z=Math.sin(n*127.1)*43758.5453;return z-Math.floor(z)};function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);draw(0)}addEventListener('resize',resize);
function draw(t){x.clearRect(0,0,w,h);const T=R?0:t*.001;if(v==='chrome'){x.globalCompositeOperation='screen';for(let i=0;i<9;i++){const px=w*(.62+Math.sin(T*.17+i)*.16),py=h*(.5+Math.cos(T*.21+i*1.7)*.25),r=Math.min(w,h)*(.1+seed(i)*.18),g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,i%3?'rgba(225,242,246,.18)':'rgba(90,120,130,.3)');g.addColorStop(.5,'rgba(80,84,90,.07)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2)}x.globalCompositeOperation='source-over'}
else if(v==='architecture'){x.strokeStyle='rgba(23,44,68,.13)';for(let i=0;i<22;i++){x.beginPath();x.moveTo(w*.72,h*.45);x.lineTo((i/21)*w,h);x.stroke()}for(let yy=90;yy<h;yy+=65){x.beginPath();x.moveTo(0,yy);x.lineTo(w,yy+Math.sin(T+yy)*3);x.stroke()}}
else if(v==='perfume'){for(let i=0;i<75;i++){const px=(seed(i)*w+Math.sin(T*.3+i)*22),py=(h-(T*(12+seed(i)*18)+seed(i+80)*h*1.4))%(h+80),r=1+seed(i+40)*5;x.fillStyle=`rgba(255,185,90,${.03+seed(i)*.12})`;x.beginPath();x.arc(px,py,r,0,6.283);x.fill()}if(burst>0){x.fillStyle=`rgba(255,185,90,${burst*.12})`;x.fillRect(0,0,w,h);burst=Math.max(0,burst-.025)}}
else if(v==='colony'){const hubs=[...document.querySelectorAll('.ac-hub')].map(n=>{const b=n.getBoundingClientRect();return[b.left+b.width/2,b.top+b.height/2]});if(hubs.length){x.strokeStyle='rgba(33,29,24,.18)';hubs.forEach((a,i)=>{const b=hubs[(i+1)%hubs.length];x.beginPath();x.moveTo(...a);x.quadraticCurveTo(w*.5,h*.5,...b);x.stroke()});for(let i=0;i<160;i++){const a=hubs[i%hubs.length],b=hubs[(i+1+colonyTarget)%hubs.length],q=(T*(.06+seed(i)*.1)+seed(i+50))%1,px=a[0]+(b[0]-a[0])*q+Math.sin(T*3+i)*5,py=a[1]+(b[1]-a[1])*q+Math.cos(T*2+i)*5;x.fillStyle=i%7?'rgba(33,29,24,.48)':'rgba(239,74,41,.8)';x.fillRect(px,py,2,2)}}}
else if(v==='cinema'){x.fillStyle='rgba(255,244,216,.17)';for(let i=0;i<120;i++)x.fillRect(seed(i)*w,(seed(i+90)*h+T*(2+seed(i)*6))%h,1+seed(i+33)*2,1+seed(i+45)*2);x.strokeStyle='rgba(255,244,216,.07)';for(let i=0;i<8;i++){const px=seed(i+200)*w;x.beginPath();x.moveTo(px,0);x.lineTo(px+Math.sin(T+i)*2,h);x.stroke()}}
else if(v==='cathedral'){const gs=[...document.querySelectorAll('.glass')];x.globalCompositeOperation='screen';gs.forEach((g,i)=>{const b=g.getBoundingClientRect(),gx=b.left+b.width/2,gy=b.top+b.height*.45;x.fillStyle=['rgba(40,182,212,.08)','rgba(221,74,161,.07)','rgba(227,180,75,.08)'][i%3];x.beginPath();x.moveTo(gx,gy);x.lineTo(mx-120,h);x.lineTo(mx+120,h);x.closePath();x.fill()});x.globalCompositeOperation='source-over'}
else if(v==='aero'){const speed=windSpeed||5;x.lineWidth=1;for(let i=0;i<38;i++){x.strokeStyle=i%6?'rgba(16,23,29,.14)':'rgba(255,84,45,.35)';x.beginPath();for(let xx=-30;xx<w+30;xx+=14){const yy=(i+1)*h/40+Math.sin(xx*.012+T*speed*.7+i)*3+Math.exp(-Math.pow(xx-mx,2)/7000)*Math.sin((xx-mx)*.035)*35;x.lineTo(xx,yy)}x.stroke()}}
else if(v==='memory'){for(let i=0;i<22;i++){const px=seed(i)*w,py=seed(i+40)*h,r=40+seed(i+70)*160,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(168,214,191,.055)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2)}}
else if(v==='bauhaus'){x.strokeStyle='rgba(17,17,17,.12)';for(let i=0;i<14;i++){x.save();x.translate(seed(i)*w,seed(i+20)*h);x.rotate(T*.12*(i%2?1:-1));x.strokeRect(-20-i*2,-20-i*2,40+i*4,40+i*4);x.restore()}}
else if(v==='polar'){x.globalCompositeOperation='screen';for(let i=0;i<5;i++){const y=60+i*38;x.strokeStyle=['rgba(112,255,213,.14)','rgba(71,140,255,.11)','rgba(179,91,255,.09)'][i%3];x.lineWidth=25+i*6;x.beginPath();for(let xx=-40;xx<w+40;xx+=20)x.lineTo(xx,y+Math.sin(xx*.008+T*.35+i)*38+Math.sin(xx*.02-T*.2)*8);x.stroke()}x.globalCompositeOperation='source-over';x.strokeStyle='rgba(112,255,213,.16)';for(let i=0;i<16;i++){x.beginPath();x.moveTo(seed(i)*w,h*.58);x.lineTo(seed(i+30)*w,h);x.stroke()}}
}
function frame(t){raf=0;draw(t);if(!document.hidden)raf=requestAnimationFrame(frame)}function motion(){if(R){draw(0);return}if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0}else if(!raf)raf=requestAnimationFrame(frame)}document.addEventListener('visibilitychange',motion);resize();motion();
</script>
