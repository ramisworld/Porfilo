<div class="bureau">

byId("tagline").textContent=plainTagline.split(/\s+[—–]\s+/)[0]||plainTagline;
byId("drawer-tagline").textContent=plainTagline;
byId("contact-meta").textContent=DATA.identity.location+" · "+DATA.email;
byId("copy-email").textContent=DATA.email?"Copy "+DATA.email:"Open GitHub";

const nameChars=String(DATA.identity.name||DATA.identity.handle||"Portfolio").toUpperCase().split("");
byId("name").innerHTML=nameChars.map(function(char){return char===" "?'<span class="space"></span>':"<span>"+esc(char)+"</span>"}).join("");
const field=byId("magnet-field");field.innerHTML=Array.from({length:84},function(){return "<i></i>"}).join("");

function techMarkup(project){return(project.tech||[]).slice(0,4).map(function(item){return"<span>"+esc(item)+"</span>"}).join("")}
function sheetMarkup(project,index){
  const star=Number(project.stars)>=STAR_MIN?" · ★ "+esc(project.stars):"";
  const long=String(project.name||"").length>18?" long":"";
  const url=safeUrl(project.repoUrl);
  return '<article class="sheet" data-sheet="'+index+'" data-mark="'+String(index+1).padStart(2,"0")+'"><div class="sheet-head"><span><b>'+String(index+1).padStart(2,"0")+"</b> / Project file</span><span>"+esc(project.year||"Undated")+star+'</span></div><h2 class="sheet-title'+long+'">'+esc(project.name||"Untitled project")+"</h2><p class=\"sheet-blurb\">"+esc(project.blurb||"Public work in the selected archive.")+'</p><div class="sheet-foot"><div class="tech">'+techMarkup(project)+'</div>'+(url?'<a class="open-repo" href="'+esc(url)+'" target="_blank" rel="noreferrer" aria-label="Open '+esc(project.name)+' repository" data-cursor="Open">↗</a>':"")+"</div></article>";
}
byId("sheet-rack").innerHTML=projects.length?projects.map(sheetMarkup).join(""):'<article class="sheet active"><div class="sheet-head"><span>Public work</span></div><h2 class="sheet-title long">Archive in preparation.</h2><p class="sheet-blurb">The rest of this portfolio remains available.</p></article>';
byId("project-tabs").style.setProperty("--count",String(Math.max(1,projects.length)));
byId("project-tabs").innerHTML=projects.map(function(project,index){return'<button class="project-tab" type="button" data-project="'+index+'" aria-label="Select '+esc(project.name)+'" aria-pressed="false" data-cursor="File">'+String(index+1).padStart(2,"0")+"</button>"}).join("");

const statRows=[
  [DATA.stats&&DATA.stats.contributionsPastYear,"Contributions / year","82%"],
  [DATA.stats&&DATA.stats.publicRepos,"Public repositories","58%"],
  [DATA.stats&&DATA.stats.featuredBuilds,"Featured builds","69%"],
  [DATA.stats&&DATA.stats.buildingSince,"Building since","91%"]
];
byId("stats").innerHTML=statRows.map(function(item,index){return'<div class="stat"><small>0'+(index+1)+" / "+esc(item[1])+"</small><b>"+esc(item[0])+'</b><i style="--fill:'+item[2]+'"></i></div>'}).join("");
byId("discipline-list").innerHTML=(DATA.disciplines||[]).map(function(item){return'<div class="discipline"><b>'+esc(item[0])+"</b><span>"+esc(item[1])+"</span></div>"}).join("");
const runnerOne=(DATA.stack||[]).map(function(item){return"<span>"+esc(item)+"</span>"}).join("");
byId("runner").innerHTML=runnerOne+runnerOne;

const linkPairs=[["GitHub",DATA.links&&DATA.links.github],["Website",DATA.links&&DATA.links.site],["LinkedIn",DATA.links&&DATA.links.linkedin],["X",DATA.links&&DATA.links.x]].filter(function(item){return safeUrl(item[1])});
byId("socials").innerHTML=linkPairs.map(function(item){return'<a href="'+esc(item[1])+'" target="_blank" rel="noreferrer" data-cursor="Open">'+esc(item[0])+" ↗</a>"}).join("");
if(DATA.credentials&&DATA.credentials.length){
  byId("open-credentials").hidden=false;
  byId("credential-panel").innerHTML=DATA.credentials.map(function(item){return'<div class="credential"><b>'+esc(item.title)+"</b><span>"+esc(item.issuer)+" · "+esc(item.year)+"</span></div>"}).join("");
}

let selected=0;
function selectProject(next){
  if(!projects.length)return;
  selected=(next+projects.length)%projects.length;
  document.querySelectorAll(".sheet").forEach(function(sheet,index){
    let slot=(index-selected+projects.length)%projects.length;
    sheet.style.setProperty("--slot",String(slot));
    sheet.classList.toggle("active",slot===0);
    sheet.classList.toggle("out",slot>Math.min(4,projects.length-1));
    sheet.setAttribute("aria-hidden",String(slot!==0));
  });
  document.querySelectorAll(".project-tab").forEach(function(tab,index){const active=index===selected;tab.classList.toggle("active",active);tab.setAttribute("aria-pressed",String(active))});
  byId("rack-status").textContent=String(selected+1).padStart(2,"0")+" / "+String(projects.length).padStart(2,"0")+" · "+projects[selected].name;
}
document.addEventListener("click",function(event){const tab=event.target.closest(".project-tab");if(tab)selectProject(Number(tab.dataset.project))});
byId("prev").addEventListener("click",function(){selectProject(selected-1)});
byId("next").addEventListener("click",function(){selectProject(selected+1)});
byId("projects").addEventListener("wheel",function(event){if(Math.abs(event.deltaY)<5)return;event.preventDefault();selectProject(selected+(event.deltaY>0?1:-1))},{passive:false});
byId("projects").addEventListener("keydown",function(event){if(event.key==="ArrowRight"||event.key==="ArrowDown"){event.preventDefault();selectProject(selected+1)}if(event.key==="ArrowLeft"||event.key==="ArrowUp"){event.preventDefault();selectProject(selected-1)}});
if(projects.length)selectProject(0);

document.querySelectorAll(".mode").forEach(function(button){button.addEventListener("click",function(){document.documentElement.dataset.layout=button.dataset.mode;document.querySelectorAll(".mode").forEach(function(item){item.classList.toggle("active",item===button)})})});
document.documentElement.dataset.layout="a";

const identity=byId("identity"),handle=byId("handle");
let dragging=false,handlePos={x:67,y:47};
function moveHandle(event){
  const rect=identity.getBoundingClientRect();
  handlePos.x=Math.max(8,Math.min(92,(event.clientX-rect.left)/rect.width*100));
  handlePos.y=Math.max(12,Math.min(88,(event.clientY-rect.top)/rect.height*100));
  document.documentElement.style.setProperty("--hx",handlePos.x+"%");
  document.documentElement.style.setProperty("--hy",handlePos.y+"%");
  const mode=handlePos.x<36?"a":handlePos.x<69?"b":"c";
  document.documentElement.dataset.layout=mode;
  document.querySelectorAll(".mode").forEach(function(item){item.classList.toggle("active",item.dataset.mode===mode)});
}
handle.addEventListener("pointerdown",function(event){dragging=true;handle.classList.add("dragging");handle.setPointerCapture(event.pointerId);moveHandle(event)});
handle.addEventListener("pointermove",function(event){if(dragging)moveHandle(event)});
handle.addEventListener("pointerup",function(event){dragging=false;handle.classList.remove("dragging");if(handle.hasPointerCapture(event.pointerId))handle.releasePointerCapture(event.pointerId)});

let px=-9999,py=-9999,pressureQueued=false;
function updatePressure(){
  pressureQueued=false;
  document.querySelectorAll(".pressure-name span:not(.space)").forEach(function(char){
    const rect=char.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const force=Math.max(0,1-Math.hypot(px-cx,py-cy)/230);
    char.style.transform="translateY("+(-12*force).toFixed(1)+"px) scaleX("+(1+.16*force).toFixed(3)+")";
    char.style.color=force>.55?"var(--blue)":"";
  });
}
identity.addEventListener("pointermove",function(event){
  px=event.clientX;py=event.clientY;
  if(!pressureQueued&&!REDUCE){pressureQueued=true;requestAnimationFrame(updatePressure)}
  field.querySelectorAll("i").forEach(function(line){
    const rect=line.getBoundingClientRect();
    const angle=Math.atan2(event.clientY-(rect.top+rect.height/2),event.clientX-(rect.left+rect.width/2))*180/Math.PI+90;
    line.style.setProperty("--a",angle+"deg");
  });
});
identity.addEventListener("pointerleave",function(){px=py=-9999;if(!REDUCE)updatePressure()});

const drawer=byId("drawer");
function setDrawer(open){drawer.classList.toggle("open",open);drawer.setAttribute("aria-hidden",String(!open));if(open)byId("close-drawer").focus()}
byId("open-contact").addEventListener("click",function(){setDrawer(true)});
byId("open-credentials").addEventListener("click",function(){setDrawer(true)});
byId("close-drawer").addEventListener("click",function(){setDrawer(false)});
addEventListener("keydown",function(event){if(event.key==="Escape")setDrawer(false)});
byId("copy-email").addEventListener("click",async function(){
  if(!DATA.email){if(DATA.links&&safeUrl(DATA.links.github))window.open(DATA.links.github,"_blank","noopener");return}
  try{await navigator.clipboard.writeText(DATA.email);byId("copy-email").textContent="Copied ✓"}catch(error){byId("copy-email").textContent=DATA.email}
});

function clock(){
  try{byId("clock").textContent=new Intl.DateTimeFormat("en-NZ",{timeZone:DATA.identity.timezone||"UTC",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date())+" "+(DATA.identity.tzLabel||"")}
  catch(error){byId("clock").textContent=DATA.identity.tzLabel||"Local"}
}
clock();setInterval(clock,1000);

let runnerX=0,raf=0,running=!REDUCE;
function animate(){
  if(!running)return;
  const runner=byId("runner"),half=runner.scrollWidth/2||1;
  runnerX-=.55;if(-runnerX>=half)runnerX+=half;
  runner.style.transform="translateX("+runnerX+"px)";
  raf=requestAnimationFrame(animate);
}
document.addEventListener("visibilitychange",function(){running=!document.hidden&&!REDUCE;if(running)raf=requestAnimationFrame(animate);else cancelAnimationFrame(raf)});
if(running)raf=requestAnimationFrame(animate);

const cursor=byId("crop-cursor"),cropX=byId("crop-x"),cropY=byId("crop-y"),cursorLabel=byId("cursor-label");
if(FINE){
  addEventListener("pointermove",function(event){
    document.documentElement.style.setProperty("--cx",event.clientX+"px");document.documentElement.style.setProperty("--cy",event.clientY+"px");
    cursor.classList.add("visible");cropX.classList.add("visible");cropY.classList.add("visible");
    const target=event.target.closest("[data-cursor],button,a");cursor.classList.toggle("target",Boolean(target));cursorLabel.textContent=target?(target.dataset.cursor||"Select"):"Compose";
  },{passive:true});
  addEventListener("pointerdown",function(){cursor.classList.add("down")});addEventListener("pointerup",function(){cursor.classList.remove("down")});
  document.addEventListener("mouseleave",function(){cursor.classList.remove("visible");cropX.classList.remove("visible");cropY.classList.remove("visible")});
}
</script>
